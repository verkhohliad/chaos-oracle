name: Contract Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: |
          git clone --depth 1 https://github.com/foundry-rs/forge-std.git lib/forge-std
          git clone --depth 1 --branch v5.0.2 https://github.com/OpenZeppelin/openzeppelin-contracts.git lib/openzeppelin-contracts

      - name: Build
        run: forge build --sizes

      - name: Run unit & integration tests
        run: forge test --skip ForkIntegration -vvv

  fork:
    name: Fork Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: |
          git clone --depth 1 https://github.com/foundry-rs/forge-std.git lib/forge-std
          git clone --depth 1 --branch v5.0.2 https://github.com/OpenZeppelin/openzeppelin-contracts.git lib/openzeppelin-contracts

      - name: Run fork tests
        run: forge test --match-contract ForkIntegration --fork-url $SEPOLIA_RPC -vvv
        env:
          SEPOLIA_RPC: ${{ secrets.SEPOLIA_RPC }}
